# =============================================================================
# Xen Installer - Configuration Minimale
# =============================================================================
# Configuration de base pour démarrer rapidement.

version: "1.0"

branding:
  name: "My Linux"
  colors:
    primary: "#3B82F6"

jobs:
  - welcome
  - name: partition
    config:
      min_install_gib: 25
      btrfs_subvolumes:
        - {name: "@", mountpoint: "/"}
        - {name: "@home", mountpoint: "/home"}
        - {name: "@root", mountpoint: "/root"}
        - {name: "@srv", mountpoint: "/srv"}
        - {name: "@cache", mountpoint: "/var/cache"}
        - {name: "@tmp", mountpoint: "/var/tmp"}
        - {name: "@log", mountpoint: "/var/log"}
        - {name: "@swap", mountpoint: "/swap"}
  - install
  - locale
  - packages
  - bootloader
  - finished
